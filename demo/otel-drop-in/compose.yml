services:
  # ── OTel Collector Contrib (reference) ────────────────────────
  otelcontribcol:
    image: otel/opentelemetry-collector-contrib:0.122.0
    command: "--config /etc/otelcol-contrib/config.yml"
    volumes:
      - ./otelcontribcol/:/etc/otelcol-contrib/:ro
    networks:
      - bridge
    ports:
      - "4318:4318"
      - "4317:4317"

  # ── Vector (drop-in replacement) ──────────────────────────────
  vector:
    build:
      context: ../..
      dockerfile: demo/otel-drop-in/Dockerfile.vector
    command: ["--config", "/etc/vector/vector.yaml"]
    volumes:
      - ./vector/:/etc/vector/:ro
    networks:
      - bridge
    ports:
      - "4328:4318"
      - "4327:4317"

  # ── Curl tests → OTel Collector ───────────────────────────────
  otel-logs:
    image: curlimages/curl:8.5.0
    command: >-
      -X POST -H 'Content-Type: application/json'
      -d @/otlpjson/logs.json
      -i otelcontribcol:4318/v1/logs
    volumes:
      - ./otlpjson/logs.json:/otlpjson/logs.json:ro
    depends_on:
      - otelcontribcol
    networks:
      - bridge

  otel-metrics:
    image: curlimages/curl:8.5.0
    command: >-
      -X POST -H 'Content-Type: application/json'
      -d @/otlpjson/metrics.json
      -i otelcontribcol:4318/v1/metrics
    volumes:
      - ./otlpjson/metrics.json:/otlpjson/metrics.json:ro
    depends_on:
      - otelcontribcol
    networks:
      - bridge

  otel-traces:
    image: curlimages/curl:8.5.0
    command: >-
      -X POST -H 'Content-Type: application/json'
      -d @/otlpjson/trace.json
      -i otelcontribcol:4318/v1/traces
    volumes:
      - ./otlpjson/trace.json:/otlpjson/trace.json:ro
    depends_on:
      - otelcontribcol
    networks:
      - bridge

  # ── Curl tests → Vector ──────────────────────────────────────
  vector-logs:
    image: curlimages/curl:8.5.0
    command: >-
      -X POST -H 'Content-Type: application/json'
      -d @/otlpjson/logs.json
      -i vector:4318/v1/logs
    volumes:
      - ./otlpjson/logs.json:/otlpjson/logs.json:ro
    depends_on:
      - vector
    networks:
      - bridge

  vector-metrics:
    image: curlimages/curl:8.5.0
    command: >-
      -X POST -H 'Content-Type: application/json'
      -d @/otlpjson/metrics.json
      -i vector:4318/v1/metrics
    volumes:
      - ./otlpjson/metrics.json:/otlpjson/metrics.json:ro
    depends_on:
      - vector
    networks:
      - bridge

  vector-traces:
    image: curlimages/curl:8.5.0
    command: >-
      -X POST -H 'Content-Type: application/json'
      -d @/otlpjson/trace.json
      -i vector:4318/v1/traces
    volumes:
      - ./otlpjson/trace.json:/otlpjson/trace.json:ro
    depends_on:
      - vector
    networks:
      - bridge

networks:
  bridge:
