sources:
  otlp:
    type: opentelemetry
    grpc:
      address: "0.0.0.0:4317"
    http:
      address: "0.0.0.0:4318"

  self_metrics:
    type: internal_metrics
    scrape_interval_secs: 15
    resource_attributes:
      service.name: sol/loadbalancer
      service.namespace: loadbalancer

transforms:
  promote_self_metrics_attrs:
    type: remap
    inputs: ["self_metrics"]
    source: |
      .attributes."service.name" = .resource.attributes."service.name"
      .attributes."service.namespace" = .resource.attributes."service.namespace"

sinks:
  otlp_traces:
    type: opentelemetry
    inputs: ["otlp.traces"]
    acknowledgements:
      enabled: true
    protocol:
      type: grpc
      load_balancing:
        routing_key: traceID
        resolver:
          type: dns
          hostname: sol-collector
      batch:
        max_events: 1000
        timeout_secs: 1

  otlp_self_metrics:
    type: opentelemetry
    inputs: ["promote_self_metrics_attrs"]
    protocol:
      type: http
      endpoint: "http://mimir:9009/otlp"
      batch:
        max_events: 1000
        timeout_secs: 15
