sources:
  otlp:
    type: opentelemetry
    grpc:
      address: "0.0.0.0:4317"
    http:
      address: "0.0.0.0:4318"

transforms:
  # Promote resource attributes to metric data point attributes.
  # Equivalent to otelcontribcol transform/metrics/dotnet processor.
  promote_resource_attrs:
    type: remap
    inputs: ["otlp.metrics"]
    source: |
      .attributes."service.name" = .resource.attributes."service.name"
      .attributes."service.namespace" = .resource.attributes."service.namespace"
      .attributes."service.version" = .resource.attributes."service.version"
      .attributes."deployment.environment" = .resource.attributes."deployment.environment"
      .attributes."host.name" = .resource.attributes."host.name"

sinks:
  # Traces go via gRPC to otelcontribcol for tail-based sampling and load balancing.
  # Logs and metrics go directly to Grafana backends over HTTP/OTLP.
  otlp_traces:
    type: opentelemetry
    inputs: ["otlp.traces"]
    acknowledgements:
      enabled: true
    protocol:
      type: grpc
      endpoint: "http://otelcontribcol-traces-loadbalancer:4317"
      batch:
        max_events: 1000
        timeout_secs: 1

  otlp_logs:
    type: opentelemetry
    inputs: ["otlp.logs"]
    acknowledgements:
      enabled: true
    protocol:
      type: http
      endpoint: "http://loki:3100/otlp"
      batch:
        max_events: 1000
        timeout_secs: 1

  otlp_metrics:
    type: opentelemetry
    inputs: ["promote_resource_attrs"]
    acknowledgements:
      enabled: true
    protocol:
      type: http
      endpoint: "http://mimir:9009/otlp"
      batch:
        max_events: 1000
        timeout_secs: 1
